<!DOCTYPE html>
<html>
<head>
    <title>My Favorites</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container py-4">
    <h2 class="mb-4">My Favorites</h2>
    {% if favorites %}
        <ul class="list-group">
            {% for fav in favorites %}
                <li class="list-group-item d-flex justify-content-between align-items-center">
                    <a href="{{ url_for('view_listing', biz_id=fav.business.id) }}">{{ fav.business.business_name }}</a>
                    <form action="{{ url_for('remove_favorite', business_id=fav.business.id) }}" method="post" style="display:inline;">
                        <button class="btn btn-warning btn-sm" type="submit">Remove</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>No favorites yet!</p>
    {% endif %}
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-4">Back to Dashboard</a>
</div>
</body>
</html>
